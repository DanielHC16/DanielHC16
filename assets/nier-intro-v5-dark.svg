<svg xmlns="http://www.w3.org/2000/svg" width="900" height="208" viewBox="0 0 900 208" role="img" aria-labelledby="title desc">
<title id="title">What&#x27;s up? I&#x27;m Daniel.</title><desc id="desc">A dedicated Software Engineer specializing in Backend Development, with diverse experience in software development and a strong passion for problem solving. I love turning complex challenges into elegant, efficient solutions that make a real difference.</desc>
<defs><style>:root{--bg:#1a1a1a;--surface:#252525;--fg:#fafafa;--accent:#c7c7cc;--muted:#aeaeb2;--border:#48484a;--selected:#c7c7cc;--selected_text:#1a1a1a;--c1:#ffffff;--c2:#e5e5ea;--c3:#aeaeb2;--c4:#7c7c80;--c5:#e5e5ea;--c6:#c7c7cc}
text{font-family:'Segoe UI',Arial,sans-serif;fill:var(--fg)}
.mono{font-family:'Consolas','Courier New',monospace;letter-spacing:1.5px}
.muted{fill:var(--muted)}.selected-text{fill:var(--selected_text)}
.line{fill:none;stroke:var(--border);stroke-width:1}.accent-line{fill:none;stroke:var(--accent);stroke-width:1}
.chrome{fill:url(#chrome)}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes counter-orbit{to{transform:rotate(-360deg)}}
@keyframes slow-pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes cube-assembly{0%,10%,100%{transform:translate(var(--dx),var(--dy));opacity:.35}36%,66%{transform:translate(0,0);opacity:1}90%{transform:translate(var(--dx),var(--dy));opacity:.35}}
.cube-face{animation:cube-assembly 12s cubic-bezier(.22,1,.36,1) infinite}
.orbit{animation:orbit 12s linear infinite}
.counter-orbit{animation:counter-orbit 12s linear infinite}
.slow-pulse{animation:slow-pulse 4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--c1)"/><stop offset="35%" stop-color="var(--c2)"/><stop offset="49%" stop-color="var(--c3)"/><stop offset="51%" stop-color="var(--c4)"/><stop offset="70%" stop-color="var(--c5)"/><stop offset="100%" stop-color="var(--c6)"/></linearGradient></defs>
<rect width="900" height="208" fill="var(--bg)"/><rect x="12.5" y="12.5" width="875" height="183" class="line"/><path class="accent-line" d="M12 26V12h14 M874 12h14v14 M12 182v14h14 M874 196h14v-14"/><rect x="28" y="4" width="174" height="17" fill="var(--bg)"/><text x="36" y="16" font-size="9" class="mono muted" >01 / PERSONAL RECORD</text><text x="36" y="67" font-size="21" class="" font-weight="600">What&#x27;s up? I&#x27;m Daniel.</text><text x="36" y="105" font-size="17">A dedicated Software Engineer specializing in <tspan font-weight="600">Backend Development</tspan>, with diverse experience in software</text><text x="36" y="131" font-size="17" class="" >development and a strong passion for problem solving. I love turning complex challenges into elegant,</text><text x="36" y="157" font-size="17" class="" >efficient solutions that make a real difference.</text></svg>
