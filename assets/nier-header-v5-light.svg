<svg xmlns="http://www.w3.org/2000/svg" width="900" height="192" viewBox="0 0 900 192" role="img" aria-labelledby="title desc">
<title id="title">Daniel Camacho / Software Engineer</title><desc id="desc">Static Daniel Camacho typography and D-16 side label. Six triangular faces assemble into an original isometric cube, pause, and unfold on a twelve-second loop. No header orbit, ring, sheen, scanning line, or blinking text.</desc>
<defs><style>:root{--bg:#fafafa;--surface:#ffffff;--fg:#1a1a1a;--accent:#636366;--muted:#636366;--border:#d1d1d6;--selected:#48484a;--selected_text:#fafafa;--c1:#7c7c80;--c2:#636366;--c3:#3a3a3c;--c4:#1c1c1e;--c5:#7c7c80;--c6:#48484a}
text{font-family:'Segoe UI',Arial,sans-serif;fill:var(--fg)}
.mono{font-family:'Consolas','Courier New',monospace;letter-spacing:1.5px}
.muted{fill:var(--muted)}.selected-text{fill:var(--selected_text)}
.line{fill:none;stroke:var(--border);stroke-width:1}.accent-line{fill:none;stroke:var(--accent);stroke-width:1}
.chrome{fill:url(#chrome)}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes counter-orbit{to{transform:rotate(-360deg)}}
@keyframes slow-pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes cube-assembly{0%,10%,100%{transform:translate(var(--dx),var(--dy));opacity:.35}36%,66%{transform:translate(0,0);opacity:1}90%{transform:translate(var(--dx),var(--dy));opacity:.35}}
.cube-face{animation:cube-assembly 12s cubic-bezier(.22,1,.36,1) infinite}
.orbit{animation:orbit 12s linear infinite}
.counter-orbit{animation:counter-orbit 12s linear infinite}
.slow-pulse{animation:slow-pulse 4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--c1)"/><stop offset="35%" stop-color="var(--c2)"/><stop offset="49%" stop-color="var(--c3)"/><stop offset="51%" stop-color="var(--c4)"/><stop offset="70%" stop-color="var(--c5)"/><stop offset="100%" stop-color="var(--c6)"/></linearGradient></defs>
<rect width="900" height="192" fill="var(--bg)"/><path class="line" d="M24 18H876 M24 180H876"/><text x="24" y="44" font-size="10" class="mono muted" >GITHUB / PERSONAL ARCHIVE</text><text x="876" y="44" font-size="11" class="mono muted" text-anchor="end">D-16</text><text x="24" y="105" font-size="47" class="chrome" font-weight="400" letter-spacing="-.5">Daniel Camacho</text><text x="26" y="134" font-size="12" class="mono muted" >SOFTWARE ENGINEER</text><text x="26" y="163" font-size="10" class="mono muted" >BUILD. LEARN. ITERATE.</text><g transform="translate(796 103)" aria-hidden="true"><g fill="var(--border)"><rect x="-66" y="-47" width="2" height="2"/><rect x="64" y="-47" width="2" height="2"/><rect x="-66" y="62" width="2" height="2"/><rect x="64" y="62" width="2" height="2"/></g><g class="cube-face" style="--dx:12px;--dy:-16px;animation-delay:0.0s"><path d="M0-38 38-16 0 6Z" fill="var(--accent)" fill-opacity="0.04" stroke="var(--accent)" stroke-width="1"/></g><g class="cube-face" style="--dx:-12px;--dy:-16px;animation-delay:-0.25s"><path d="M0-38 0 6-38-16Z" fill="var(--accent)" fill-opacity="0.07" stroke="var(--accent)" stroke-width="1"/></g><g class="cube-face" style="--dx:-18px;--dy:0px;animation-delay:-0.5s"><path d="M-38-16 0 6-38 28Z" fill="var(--accent)" fill-opacity="0.03" stroke="var(--accent)" stroke-width="1"/></g><g class="cube-face" style="--dx:-12px;--dy:14px;animation-delay:-0.75s"><path d="M0 6 0 50-38 28Z" fill="var(--accent)" fill-opacity="0.05" stroke="var(--accent)" stroke-width="1"/></g><g class="cube-face" style="--dx:18px;--dy:0px;animation-delay:-1.0s"><path d="M0 6 38-16 38 28Z" fill="var(--accent)" fill-opacity="0.1" stroke="var(--accent)" stroke-width="1"/></g><g class="cube-face" style="--dx:12px;--dy:14px;animation-delay:-1.25s"><path d="M0 6 38 28 0 50Z" fill="var(--accent)" fill-opacity="0.08" stroke="var(--accent)" stroke-width="1"/></g></g></svg>
